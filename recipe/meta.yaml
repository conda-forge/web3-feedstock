{% set name = "web3" %}
{% set version = "8.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8d898fe1909037d6269c998d27c1806ce201cf6d7e49514ad6f3e4dcc64e6e9a

build:
  number: 0
  skip: false
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - aiohttp >=3.7.4.post0
    - eth-abi >=6.0.0
    - eth-account >=0.14.0
    - eth-hash[pycryptodome] >=0.5.1
    - eth-typing >=5.0.0
    - eth-utils >=5.3.0
    - hexbytes >=2.0.0
    - pydantic >=2.4.0
    - pyunormalize >=15.0.0
    - pywin32 >=223  # [win]
    - requests >=2.23.0
    - typing-extensions >=4.0.1  # [ python_version < 3.11 ]
    - websockets >=14.0.0

test:
  imports:
    - web3
    - ens

about:
  home: https://github.com/ethereum/web3.py
  summary: Web3.py
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
